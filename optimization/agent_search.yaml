hosts:
  server: 10.10.1.1
  clients:
    - 10.10.1.2
    - 10.10.1.3

client_interface: eno1d1
# Optional per-client override (host -> interface) for clients whose NIC names differ;
# hosts not listed use client_interface.
# client_interfaces:
#   10.10.1.2: eno1d1
#   10.10.1.3: enp4s0f0np0
input_file: /local/repository/dnsperf_input

dns_service: ns_bind
dns_services:
  start_script: /local/repository/start_dns_service.sh
  stop_script: /local/repository/stop_dns_service.sh

tool: kxdpgun
threads: 8
ports_per_thread: 64
timeout: 1
pause_between_runs: 2

max_sustainable_qps:
  initial_qps: 100000
  min_qps_step: 10000
  max_qps: 3000000
  num_trials: 5
  min_passes: 4
  trial_duration: 30
  answer_rate_threshold: 99.0
  min_qps_fidelity_pct: 99.0
  collectl: false
  collectl_margin: 3

agent:
  # bounded: the agent picks values for the parameters below, within their
  #          agent: bounds.
  # open:    the agent may apply any named.conf.options statements (except
  #          listen-on, allow-query, recursion, rate-limit, directory) and any
  #          root shell commands on the name server, including kernel command
  #          line changes and reboots. host_state.py snapshots the server first
  #          and restores it after every measurement. --mode overrides.
  mode: open
  reboot_timeout: 900      # open mode: seconds to wait for the server after a reboot
  max_configs: 20          # most measurements, repeats included (--max-configs overrides)
  backend: api             # api (Anthropic API credits) | claude-code (claude -p, subscription limits)
  # model: claude-opus-5   # default: claude-opus-5 for api, Claude Code's default for claude-code
  effort: high             # low | medium | high | xhigh | max
  # max_turns: 180         # default: 8 per measurement + 20
  # claude-code backend: stop measuring (the agent writes its report) once the
  # subscription's usage reaches these percentages. Leave out for no limit.
  max_session_usage: 50    # 5-hour session window (--max-session-usage)
  max_weekly_usage: 50     # weekly window (--max-weekly-usage)

# Bounded mode: the agent may measure any value within each parameter's agent
# bounds. "values" are shown to it as suggestions; the first value of every
# parameter makes up the starting (baseline) configuration.
# Open mode: these are shown to the agent only as known knobs to consider.
parameters:
  - name: udp-receive-buffer
    values: [4194304, 16777216]
    agent: {type: int, min: 1048576, max: 67108864,
            description: "BIND udp-receive-buffer (bytes); capped by net.core.rmem_max"}
  - name: udp-send-buffer
    values: [4194304, 16777216]
    agent: {type: int, min: 1048576, max: 67108864,
            description: "BIND udp-send-buffer (bytes); capped by net.core.wmem_max"}
  - name: max-udp-size
    values: [1232, 2048, 4096]
    agent: {type: int, min: 512, max: 4096,
            description: "BIND max-udp-size (bytes)"}

  # Host-level tuning on the name server (optimization/system_config.py).
  # "default" leaves the host's own setting in place.
  - name: udp-conntrack
    values: [default, ufw-off, notrack, conntrack-raised]
    agent: {type: enum,
            description: "ufw is enabled by profile.py. ufw-off disables it; notrack adds raw-table NOTRACK rules for udp/53; conntrack-raised raises nf_conntrack_max and hashsize"}
  - name: rmem
    values: [default, 16777216, 67108864]
    agent: {type: int, min: 212992, max: 268435456,
            description: "net.core.rmem_max and rmem_default (stock 212992)"}
  - name: netdev-max-backlog
    values: [default, 5000, 30000]
    agent: {type: int, min: 1000, max: 1000000,
            description: "net.core.netdev_max_backlog (stock 1000)"}
  - name: netdev-budget
    values: [default, "600/4000", "3000/16000"]
    agent: {type: pair, min: [300, 2000], max: [100000, 1000000],
            description: "net.core.netdev_budget / netdev_budget_usecs (stock 300/2000)"}
  - name: udp-mem
    values: [default, raised]
    agent: {type: enum,
            description: "raised: udp_rmem_min/udp_wmem_min -> 16 KB and udp_mem x4"}
  - name: optmem-max
    values: [default, 65536]
    agent: {type: int, min: 20480, max: 16777216,
            description: "net.core.optmem_max (stock 20480)"}
  - name: named-nofile
    values: [default, 1048576]
    agent: {type: int, min: 1024, max: 4194304,
            description: "LimitNOFILE for named.service"}
